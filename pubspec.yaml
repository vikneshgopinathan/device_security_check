name: device_security_check
description: A Flutter plugin for device security checking. Detect rooted/jailbroken devices and developer mode on iOS and Android.
version: 0.1.0
homepage: https://github.com/vikneshgopinathan/device_security_check
repository: https://github.com/vikneshgopinathan/device_security_check
issue_tracker: https://github.com/vikneshgopinathan/device_security_check/issues
documentation: https://github.com/vikneshgopinathan/device_security_check#readme
topics:
  - security
  - device
  - root-detection
  - flutter
  - plugin

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.device_security_check
        pluginClass: DeviceSecurityCheckPlugin
      ios:
        pluginClass: DeviceSecurityPlugin

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
