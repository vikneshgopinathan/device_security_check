name: device_security_check
description: A Flutter plugin that provides comprehensive device security checking capabilities for both iOS and Android devices. Detect rooted/jailbroken devices, developer mode, and other security compromises.
version: 0.0.1
homepage: https://github.com/your-username/device_security_check
repository: https://github.com/your-username/device_security_check
issue_tracker: https://github.com/your-username/device_security_check/issues
documentation: https://github.com/your-username/device_security_check#readme
topics:
  - security
  - device
  - root-detection
  - flutter
  - plugin

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

